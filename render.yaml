services:
  - type: web
    name: one-piece-card-price-checker
    runtime: node
    plan: free
    repo: https://github.com/fs-capital-six/one-piece-card-price-checker
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
